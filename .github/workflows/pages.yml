name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Keep Playwright apt dependencies on a stable supported distribution.
    # The ubuntu-latest 26.04 image hit a Microsoft apt-repository 403.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run focused unit tests
        run: npm run test:unit
      - name: Build district portal and A1 app
        run: npm run build
      - name: Verify static output
        run: npm run verify:dist
      - name: Install smoke-test browser
        run: npx playwright install --with-deps chromium
      - name: Run focused Chromium smoke suite
        run: npm run test:smoke:ci
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173/naksaeng/bunfirvil/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
